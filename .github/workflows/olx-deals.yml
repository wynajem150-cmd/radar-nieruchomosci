name: Radar okazji OLX

on:
  workflow_dispatch:
  schedule:
    - cron: "6,21,36,51 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: radar-olx
      cancel-in-progress: false

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Uruchom radar okazji OLX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OLX_TELEGRAM_CHAT_ID: ${{ secrets.OLX_TELEGRAM_CHAT_ID }}
        run: python src/olx_deals.py

      - name: Dzienny raport Telegram OLX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OLX_TELEGRAM_CHAT_ID: ${{ secrets.OLX_TELEGRAM_CHAT_ID }}
        run: python src/olx_daily_report.py

      - name: Zapisz stan radaru i statystyki
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add olx_deals_seen.json olx_daily_stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aktualizacja okazji OLX"
          git pull --rebase origin main
          git push

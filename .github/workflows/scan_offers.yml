name: Radar Okazji - alerty i podsumowanie

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Tryb uruchomienia
        required: true
        default: alerts
        type: choice
        options:
          - alerts
          - summary
      dry_run:
        description: Tylko pobierz i pokaż wynik bez wysyłki
        required: true
        default: false
        type: boolean
  schedule:
    # Alert po zakończeniu godzinnych skanów i benchmarków Supabase (minuty 5–32).
    - cron: '40 * * * *'
    # Dwa terminy UTC obsługują zmianę czasu CET/CEST.
    # Edge Function wyśle podsumowanie tylko o 20:00 Europe/Warsaw.
    - cron: '0 18,19 * * *'

permissions:
  contents: read

concurrency:
  group: radar-okazji-offers
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser tests
        run: python -m unittest -v test_parser.py

      - name: Dispatch alerts or daily summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RADAR_MODE: ${{ github.event.schedule == '0 18,19 * * *' && 'summary' || inputs.mode || 'alerts' }}
          RADAR_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scanner.py

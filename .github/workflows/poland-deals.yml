name: Radar Polska

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/poland_deals.py'
      - '.github/workflows/poland-deals.yml'
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Uruchom radar Polska
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VACATION_TELEGRAM_CHAT_ID: ${{ secrets.VACATION_TELEGRAM_CHAT_ID }}
        run: python src/poland_deals.py

      - name: Zapisz stan
        run: |
          if git diff --quiet -- poland_deals_seen.json; then
            exit 0
          fi
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add poland_deals_seen.json
          git commit -m "Aktualizacja radaru Polska"
          git push

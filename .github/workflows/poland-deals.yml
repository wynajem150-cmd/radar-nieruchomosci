name: Radar Polska

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: radar-polska
      cancel-in-progress: false

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Uruchom radar Polska
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VACATION_TELEGRAM_CHAT_ID: ${{ secrets.VACATION_TELEGRAM_CHAT_ID }}
        run: python src/poland_deals.py

      - name: Zapisz stan
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add poland_deals_seen.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aktualizacja radaru Polska"
          git pull --rebase origin main
          git push

name: Test alertów Telegram

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-telegram.yml'
      - 'src/test_telegram.py'

jobs:
  send-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Wyślij testy do OKAZJE OLX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.OLX_TELEGRAM_CHAT_ID }}
        run: python src/test_telegram.py

name: Diagnostyka radaru wakacji

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vacation-debug.yml'
      - 'src/vacation_verify_debug.py'
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: python src/vacation_verify_debug.py

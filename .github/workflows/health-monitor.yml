name: Monitor techniczny radarów

on:
  workflow_dispatch:
  schedule:
    - cron: "26,56 * * * *"

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: radar-health
      cancel-in-progress: false

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sprawdź zdrowie źródeł
        env:
          SEARCH_CONFIG_JSON: ${{ secrets.SEARCH_CONFIG_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLX_TELEGRAM_CHAT_ID: ${{ secrets.OLX_TELEGRAM_CHAT_ID }}
          VACATION_TELEGRAM_CHAT_ID: ${{ secrets.VACATION_TELEGRAM_CHAT_ID }}
          HEALTH_DRY_RUN: "0"
        run: python src/health_check.py

      - name: Zapisz stan monitora
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add health_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aktualizacja monitora technicznego"
          git pull --rebase origin main
          git push

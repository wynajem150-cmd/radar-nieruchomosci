name: Radar wakacji

on:
  workflow_dispatch:
  schedule:
    - cron: "14,44 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: radar-wakacje
      cancel-in-progress: false

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Uruchom radar wakacji
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VACATION_TELEGRAM_CHAT_ID: ${{ secrets.VACATION_TELEGRAM_CHAT_ID }}
          VACATION_DRY_RUN: "0"
        run: python src/vacation_strict.py

      - name: Raport dzienny
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VACATION_TELEGRAM_CHAT_ID: ${{ secrets.VACATION_TELEGRAM_CHAT_ID }}
        run: python src/vacation_daily_report.py

      - name: Zapisz stan radaru
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add vacation_state.json vacation_daily_stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aktualizacja radaru wakacji"
          git pull --rebase origin main
          git push

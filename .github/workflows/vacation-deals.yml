name: Radar wakacji

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/vacation_deals.py'
      - '.github/workflows/vacation-deals.yml'
  schedule:
    - cron: "8,38 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Uruchom radar wakacji
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VACATION_TELEGRAM_CHAT_ID: ${{ secrets.VACATION_TELEGRAM_CHAT_ID }}
        run: python src/vacation_deals.py

      - name: Raport dzienny
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VACATION_TELEGRAM_CHAT_ID: ${{ secrets.VACATION_TELEGRAM_CHAT_ID }}
        run: python src/vacation_daily_report.py

      - name: Zapisz stan radaru
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- vacation_state.json vacation_daily_stats.json; then
            exit 0
          fi
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add vacation_state.json vacation_daily_stats.json
          git commit -m "Aktualizacja radaru wakacji"
          git push

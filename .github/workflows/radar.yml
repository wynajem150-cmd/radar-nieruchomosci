name: Radar nieruchomości

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Uruchom radar
        env:
          SEARCH_CONFIG_JSON: ${{ secrets.SEARCH_CONFIG_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export SEARCH_CONFIG_JSON="$(python -c 'import json,os; c=json.loads(os.environ["SEARCH_CONFIG_JSON"]); c["threshold"]=60; print(json.dumps(c))')"
          python src/main.py

      - name: Zapisz znalezione oferty
        run: |
          if git diff --quiet -- seen.json; then
            exit 0
          fi
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add seen.json
          git commit -m "Aktualizacja ofert"
          git push
